# =============================================================================
# ApexOS base-image build — docker-base (build-pipeline owned).
#
# Installed in the product repo as .github/workflows/apexos-build.yml.
# PIPELINE-OWNED SURFACE (`.github/workflows/apexos-*.yml`): never hand-edit
# there — source of truth is build-pipeline tools/harness/ci/build/docker-base.yml.
#
# Variant matrix (proven locally, DOCKER-BASE-REPORT §7-8): alpine 3.23,
# python 3.13 + 3.14 (on the freshly built alpine base), debian trixie,
# ubuntu 26.04 — each on amd64 + arm64 (self-hosted apexos-builder, arch-routed by label),
# production Dockerfiles UNMODIFIED (the colima ADD --unpack localfixes do
# not apply on GitHub runners). Every built image is denylist-gated
# (tools/gate via BUILD_PIPELINE_TOKEN checkout) with violations==0 AND
# skipped==0 asserted BEFORE any push. `image-gate` aggregates the matrix as
# the required status check.
#
# Push (main only):
#   ghcr.io/apexinfosysindia/<image>:<tag>[-<upstream calver>]  (GITHUB_TOKEN,
#     packages:write) — the plugin fleet's pinned FROM
#     ghcr.io/apexinfosysindia/base:3.23-2026.06.1 resolves from here;
#   registry.apexinfosys.in/apexos/* mirror — continue-on-error while the
#     box's token-server split is pending (blocked-on-box must not redden
#     the gate).
# Per-arch tags <tag>-<ver>-{amd64,aarch64} are pushed by the build legs;
# the merge job stitches them into multi-arch manifests <tag> + <tag>-<ver>,
# plus base:latest on ghcr ONLY (task #36): the Supervisor's local-addon
# build path (apps/build.py) defaults BUILD_FROM to
# ghcr.io/apexinfosysindia/base:latest when an addon's build.yaml lacks
# build_from, and builds with `docker buildx build --pull` — so ghcr must
# serve that tag or those addon builds die at runtime. Nothing consumes a
# registry-mirror base:latest, so the mirror stays versioned-only.
# =============================================================================
name: apexos-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apexos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_NS: ghcr.io/apexinfosysindia
  REGISTRY: registry.apexinfosys.in
  REGISTRY_NS: registry.apexinfosys.in/apexos
  ALPINE_VERSION: "3.23"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant.name }} (${{ matrix.arch.name }})
    # dependabot's actor can't read org secrets (BUILD_PIPELINE_TOKEN,
    # REGISTRY_*) — skip instead of failing red; image-gate skips in
    # lockstep, and a skipped required check passes branch protection.
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write # for keyless cosign signing (Sigstore/Fulcio via OIDC)
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            runner: [self-hosted, apexos-builder, linux, X64]
          - name: aarch64
            runner: [self-hosted, apexos-builder, ARM64]
        variant:
          # container_builder: alpine/debian/ubuntu use `ADD --unpack=true`,
          # which needs a newer BuildKit than the runner daemon's builtin
          # frontend — build them in a docker-container buildx builder (the
          # upstream-CI-equivalent path; DOCKER-BASE-REPORT §7's colima
          # gotcha does not apply there) and --load into the daemon. The
          # python Dockerfiles use plain ADD + tar (no --unpack) and MUST
          # use the docker driver so their FROM resolves to the locally
          # prebuilt alpine base, never the remote tag.
          - name: alpine
            image: base
            context: alpine
            tag: "3.23"
            args: ALPINE_VERSION=3.23
            prebuild_alpine: false
            container_builder: true
          - name: python3.13
            image: base-python
            context: python/3.13
            tag: 3.13-alpine3.23
            args: BASE_IMAGE=ghcr.io/apexinfosysindia/base BASE_VERSION=3.23
            prebuild_alpine: true
            container_builder: false
          - name: python3.14
            image: base-python
            context: python/3.14
            tag: 3.14-alpine3.23
            args: BASE_IMAGE=ghcr.io/apexinfosysindia/base BASE_VERSION=3.23
            prebuild_alpine: true
            container_builder: false
          - name: debian
            image: base-debian
            context: debian
            tag: trixie
            args: DEBIAN_VERSION=trixie
            prebuild_alpine: false
            container_builder: true
          - name: ubuntu
            image: base-ubuntu
            context: ubuntu
            tag: "26.04"
            args: UBUNTU_VERSION=26.04
            prebuild_alpine: false
            container_builder: true
    env:
      IMAGE: ${{ matrix.variant.image }}
      TAG: ${{ matrix.variant.tag }}
      ARCH: ${{ matrix.arch.name }}
    steps:
      # The self-hosted builders share ONE disk across every job of every repo,
      # and nothing bounds what accumulates on it: BuildKit's cache, plus a
      # tagged image per leg per build. On 2026-08-12 the amd64 builder reached
      # zero bytes free and took out core's apexos-build (`docker save` ->
      # "no space left on device") and ten addons image builds (pip install
      # torch, same errno 28) within the hour. Hosted runners never showed this
      # because every job got a fresh disk.
      #
      # Trim only when the disk is actually tight, so a warm cache survives the
      # common case: dangling images first (nothing references them), then the
      # BuildKit cache down to a budget. `df -Pk` because the ARM64 builder is
      # macOS, where df has neither -BG nor --output.
      #
      # This bounds what CI itself leaves behind; it cannot bound what else
      # lives on a shared box. The 2026-08-12 fill was mostly a 199 GB manual
      # buildroot tree in the runner account's home, and Docker held only 64 GB
      # of the 290 GB volume. If this step reports single-digit free space even
      # after pruning, the culprit is outside CI -- go look at the whole disk.
      - name: reclaim disk when the shared builder is low
        run: |
          free_gb=$(df -Pk . | awk 'NR==2 {print int($4 / 1048576)}')
          echo "free before: $free_gb GiB"
          docker system df || true
          if [ "$free_gb" -lt 20 ]; then
            docker image prune -f || true
            # Prune every buildx builder this pipeline owns, not just the
            # selected one: we keep TWO (apexos-ci and apexos-cross), and a
            # bare `buildx prune` only touches whichever is current, so the
            # other's cache grows forever. Names come from column 1 of
            # `buildx ls`, minus the header and the indented node rows, with
            # the current-builder `*` stripped; the apexos- filter keeps us off
            # any builder the Mac's owner created. (--keep-storage is renamed
            # --max-storage on buildx >= 0.31 but still honoured there, so it
            # stays for the older CLI.)
            builders=$(docker buildx ls 2>/dev/null | tail -n +2 \
              | grep -v '^[[:space:]]' \
              | awk 'NF {gsub(/\*$/, "", $1); print $1}' \
              | grep '^apexos-' || true)
            if [ -n "$builders" ]; then
              for b in $builders; do
                echo "pruning buildx cache: $b"
                docker buildx prune -f --builder "$b" --keep-storage=10GB || true
              done
            else
              docker buildx prune -f --keep-storage=10GB \
                || docker builder prune -f --keep-storage=10GB || true
            fi
            # Tagged build products pile up too (every leg tags <image>:ci and
            # the per-arch refs it pushes), and dangling-only pruning never
            # touches them. Sweep the unused ones older than a week -- on the
            # LINUX builder only: the ARM64 builder is a workstation with its
            # own images and stopped containers, and `prune -a` there would
            # sweep things this pipeline does not own.
            if [ "$(uname)" = "Linux" ]; then
              docker image prune -a -f --filter until=168h || true
            fi
            df -Ph .
          fi

      - name: checkout docker-base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
          persist-credentials: false

      - name: checkout build-pipeline (gate tool + master map)
        # BUILD_PIPELINE_TOKEN is an ed25519 SSH deploy key (READ-ONLY on
        # build-pipeline), NOT a PAT — actions/checkout `token:` cannot consume
        # it. Stored double-base64 so the secret survives newline mangling.
        env:
          BUILD_PIPELINE_KEY_B64: ${{ secrets.BUILD_PIPELINE_TOKEN }}
        run: |
          key_file=$(mktemp)
          chmod 600 "$key_file"
          echo "$BUILD_PIPELINE_KEY_B64" | base64 -d | base64 -d > "$key_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o StrictHostKeyChecking=accept-new"
          url=git@github.com:apexinfosysindia/build-pipeline.git

          # Reuse the warm clone instead of `rm -rf` + fresh clone every leg.
          # build-pipeline is ~28 MB (a 20 MB wheel and a 7.6 MB translations
          # tarball sit in HEAD), and this fleet's GitHub pack throughput is not
          # dependable: on 2026-08-15 the macOS builder measured ~20 KB/s to
          # GitHub -- over SSH *and* over HTTPS to codeload, so it is not a
          # protocol problem -- while pulling 10 MB/s from the OTA host on the
          # same link. A fresh clone ran 22.5 minutes and died with "fetch-pack:
          # unexpected disconnect while reading sideband packet / fatal: early
          # EOF", failing the aarch64 leg of the 2026.08.0 supervisor release
          # build. A clone cannot resume, so every retry paid the full 28 MB
          # again.
          #
          # Build workflows check the product repo out into `path: src`, so the
          # workspace ROOT is not a git repo and checkout's `git clean` never
          # sweeps this nested clone -- it survives between jobs, and an
          # incremental depth-1 fetch moves only the delta (text-only in
          # practice: the wheel and the tarball almost never change). `git clean
          # -ffdx` covers what the old `rm -rf` existed for: a second matrix leg
          # on the same runner tripping over "destination path already exists"
          # (exit 128).
          fetch_bp() {
            if [ -d .build-pipeline/.git ]; then
              git -C .build-pipeline remote set-url origin "$url" &&
              git -C .build-pipeline fetch --depth=1 origin main &&
              git -C .build-pipeline checkout -f FETCH_HEAD &&
              git -C .build-pipeline clean -ffdx
            else
              git clone --depth=1 "$url" .build-pipeline
            fi
          }

          # Retry with backoff: a dropped transfer is not a permissions or a ref
          # error, and a release build should not die on one bad connection. The
          # rm -rf before a retry is what makes attempt 2 sound -- a
          # half-transferred clone leaves a .git the reuse branch would trust.
          for attempt in 1 2 3; do
            if fetch_bp; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not obtain build-pipeline after 3 attempts"
              rm -f "$key_file"
              exit 1
            fi
            echo "attempt $attempt failed -- retrying in $((attempt * 30))s"
            rm -rf .build-pipeline
            sleep $((attempt * 30))
          done
          rm -f "$key_file"

      # NO actions/setup-python. On the self-hosted macOS builder its fallback
      # installer (actions/python-versions setup.sh) resolves the tool cache
      # from AGENT_TOOLSDIRECTORY, which setup-python itself pins to the
      # hosted-image path /Users/runner/hostedtoolcache -- a directory that
      # cannot exist here (the builder runs as 'advait'), so the step dies on
      # `mkdir: /Users/runner: Permission denied`. It also shells out to
      # `sudo installer`, which has no TTY on a runner.
      #
      # Provision from the runner's own interpreter instead. The Linux builder
      # (Ubuntu 24.04) ships python3.12 WITH PyYAML 6.0.1 but WITHOUT pip and
      # WITHOUT ensurepip -- so `python3 -m venv` fails there and there is no
      # pip to recover with. Probe for an interpreter that can already import
      # yaml and only install when none can. Neither builder exposes an
      # unversioned `python`, which the gate steps invoke, so always shim it.
      - name: provision python + gate deps (runner-native interpreter)
        run: |
          set -eu
          py=""
          cand=""
          for c in python3.12 python3.13 python3.11 python3 python; do
            p=$(command -v "$c" 2>/dev/null) || continue
            if [ -z "$cand" ]; then cand="$p"; fi
            if "$p" -c 'import yaml' 2>/dev/null; then py="$p"; break; fi
          done
          if [ -z "$py" ]; then
            if [ -z "$cand" ]; then echo "no python3 on this runner" >&2; exit 1; fi
            py="$cand"
            venv="$RUNNER_TEMP/gatevenv"
            if "$py" -m venv "$venv" 2>/dev/null && "$venv/bin/python" -m pip --version >/dev/null 2>&1; then
              "$venv/bin/python" -m pip install -q --disable-pip-version-check pyyaml
              py="$venv/bin/python"
            elif "$py" -m pip install -q --user --break-system-packages pyyaml 2>/dev/null; then
              :
            else
              "$py" -m pip install -q --user pyyaml
            fi
          fi
          "$py" -c 'import sys, yaml; print(sys.version, "pyyaml", yaml.__version__)'
          shim="$RUNNER_TEMP/pyshim"
          mkdir -p "$shim"
          ln -sf "$py" "$shim/python"
          echo "$shim" >> "$GITHUB_PATH"

      - name: read upstream calver (.apexos/provenance.yaml)
        id: version
        run: |
          v=$(python -c "import yaml; print(yaml.safe_load(open('src/.apexos/provenance.yaml'))['upstream']['ref'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Refresh the ghcr credential BEFORE any build, not just before the
      # pushes below. The python Dockerfiles inherit config with a second
      # `FROM ${BUILD_FROM}` = ghcr.io/apexinfosysindia/base:3.23, and BuildKit
      # resolves that ref's metadata from the REGISTRY even though the previous
      # step just --loaded that exact tag into the local daemon -- so every
      # python leg makes a ghcr token request whether or not it needs to pull.
      #
      # On a self-hosted runner ~/.docker/config.json is shared by every job,
      # and a GITHUB_TOKEN dies with the job that minted it. A leftover ghcr
      # entry therefore makes BuildKit present an EXPIRED credential, and ghcr
      # answers 403 rather than falling back to anonymous -- so the leg fails
      # even for a package it could have read with no credential at all (proven
      # live: run 31545974467, `python3.13 (amd64)` + `python3.14 (amd64)`,
      # `failed to fetch oauth token: ... 403 Forbidden` on
      # `scope=repository:apexinfosysindia/base:pull`; the aarch64 legs passed
      # because that builder carried no stale entry). Clearing the file by hand
      # only holds until the next job re-staleses it; logging in per-job is the
      # durable fix. The other build templates already refresh the credential
      # in their `ensure base image locally` step -- this is the one job that
      # builds FROM ghcr without pulling first.
      - name: refresh ghcr credential (BuildKit resolves FROM via the registry)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Create the builder only when it is MISSING. On a self-hosted runner the
      # Docker daemon is shared across jobs, so a named builder left behind by
      # a previous -- or concurrently running -- matrix leg is already there,
      # and a bare `docker buildx create --name apexos-ci` dies with
      # `ERROR: existing instance for "apexos-ci" but no append mode, specify
      # the node name to make changes for existing instances` (proven live:
      # docker-base run 31541384904, job `ubuntu (amd64)`). Hosted runners never
      # hit this because every job got a fresh VM.
      #
      # Reuse is safe and desirable: buildkit serves concurrent builds from
      # several jobs, and sharing the instance shares its build cache. The
      # builds below all pass `--builder apexos-ci` explicitly, so no `--use`.
      # The trailing inspect absorbs the create/create race when two legs both
      # observe it missing at the same moment -- whoever loses still ends up
      # with a usable builder, so the step must not fail.
      - name: create buildx container builder (ADD --unpack support)
        run: |
          docker buildx inspect apexos-ci >/dev/null 2>&1 \
            || docker buildx create --name apexos-ci --driver docker-container \
            || docker buildx inspect apexos-ci >/dev/null

      - name: prebuild alpine base (python variants build FROM it locally)
        if: matrix.variant.prebuild_alpine
        run: |
          docker buildx build --builder apexos-ci --load src/alpine \
            --build-arg "ALPINE_VERSION=$ALPINE_VERSION" \
            -t "$GHCR_NS/base:$ALPINE_VERSION"

      # io.apexos.arch (the transformed upstream builder arch label): the
      # fleet's product images set it on their own build command too, but
      # stamping the bases keeps parity with upstream's builder-labelled
      # base images.
      - name: build ${{ matrix.variant.image }}:${{ matrix.variant.tag }} (production Dockerfile, unmodified)
        env:
          CONTEXT: ${{ matrix.variant.context }}
          ARGS: ${{ matrix.variant.args }}
          CONTAINER_BUILDER: ${{ matrix.variant.container_builder }}
        run: |
          build_args=()
          for a in $ARGS; do build_args+=(--build-arg "$a"); done
          builder_flag=()
          if [ "$CONTAINER_BUILDER" = "true" ]; then builder_flag=(--builder apexos-ci); fi
          docker buildx build "${builder_flag[@]}" --load "src/$CONTEXT" "${build_args[@]}" --label "io.apexos.arch=$ARCH" -t "$IMAGE:ci"

      - name: gate built image (denylist, violations==0 && skipped==0)
        working-directory: .build-pipeline/tools/gate
        run: |
          docker save "$IMAGE:ci" -o "$RUNNER_TEMP/image.tar"
          rc=0
          python -m apexos_gate --map ../../transform/rename-map.yaml --json "$RUNNER_TEMP/image.tar" \
            > "$RUNNER_TEMP/gate.json" || rc=$?
          python - "$RUNNER_TEMP/gate.json" "$rc" <<'PY'
          import json, sys

          gr = json.load(open(sys.argv[1]))
          rc = int(sys.argv[2])
          st = gr["stats"]
          print(f"gate: exit={rc} violations={st['violations']} "
                f"allowed={st['allowed']} skipped={st['skipped']} errors={st['errors']}")
          for v in gr["violations"][:25]:
              print(f"  VIOLATION {v.get('term')!r}: {v.get('path')}")
          for s in gr["skipped"][:25]:
              print(f"  SKIPPED {s.get('path')}: {s.get('reason')}")
          # REQUIRED: clean gate AND zero skips (a skipped file is an unscanned file)
          sys.exit(1 if rc != 0 or st["violations"] or st["skipped"] or st["errors"] else 0)
          PY

      - name: install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: push per-arch image to ghcr (main only)
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ref="$GHCR_NS/$IMAGE:$TAG-$VERSION-$ARCH"
          # VERSION is a stable pin (.apexos/provenance.yaml), not a per-build
          # timestamp — every push to main rebuilds under the SAME tag. An
          # unrelated Dockerfile/CI change that doesn't bump the pin must not
          # silently overwrite an already-shipped tag with different bytes.
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "::warning::$ref already exists — bump .apexos/provenance.yaml to republish. Skipping push."
          else
            docker tag "$IMAGE:ci" "$ref"
            docker push "$ref"
            # Keyless signing (Sigstore/Fulcio via this job's OIDC token, no
            # key management). The digest gets recorded in the public Rekor
            # transparency log — that only proves "this specific hash was
            # signed by this GitHub Actions run," it reveals nothing about
            # the (private) image contents.
            cosign sign --yes "$ref" || echo "::warning::cosign sign failed for $ref"
          fi

      - name: push per-arch image to registry mirror (blocked-on-box tolerated)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::warning::REGISTRY_PASSWORD not set — skipping registry push"
            exit 1
          fi
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          ref="$REGISTRY_NS/$IMAGE:$TAG-$VERSION-$ARCH"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "::warning::$ref already exists — bump .apexos/provenance.yaml to republish. Skipping push."
          else
            docker tag "$IMAGE:ci" "$ref"
            docker push "$ref"
            cosign sign --yes "$ref" || echo "::warning::cosign sign failed for $ref"
          fi

      # Every `docker login` in this job writes its credential into
      # ~/.docker/config.json, and these runners' home directories are SHARED
      # and outlive the job, so nothing removes it. The aarch64 builder was
      # found holding a ghs_ job token from some earlier run this way: while
      # that token is valid it is a live credential on disk for whatever runs
      # next, and afterwards it is a dead entry that docker keeps offering, so
      # a registry failure no longer says which credential was even tried.
      #
      # always() so a failure earlier in the job does not skip the cleanup, and
      # never fail the job on it: `docker logout` already exits 0 for a registry
      # that was never logged into, so a nonzero here would only mask the real
      # result.
      - name: drop the registry credentials from the shared runner home
        if: always()
        run: |
          docker logout ghcr.io || true
          docker logout "$REGISTRY" || true

  image-gate:
    name: image-gate
    needs: build
    # always() so a FAILED build still turns the gate red; the dependabot
    # term skips the required check in lockstep with build (skipped counts
    # as passing). Job name is the required-status-check — never rename.
    if: always() && github.actor != 'dependabot[bot]'
    # Linux builder ONLY: the bare [self-hosted, apexos-builder] label set also
    # matches the ARM64 builder, which is macOS and the fleet's ONLY aarch64
    # capacity — the same runner this workflow's own aarch64 build leg (and the
    # OS image build) has to queue for. Nothing here needs a machine at all
    # (one `test` on a matrix result), so it must not be the job that squats
    # that slot; unpinned, which of the two it landed on was a coin flip.
    runs-on: [self-hosted, apexos-builder, linux, X64]
    steps:
      - name: assert every variant/arch built and passed the denylist gate
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build matrix result: $RESULT"
          test "$RESULT" = "success"

  merge:
    name: publish multi-arch manifests
    needs: build
    if: github.event_name != 'pull_request'
    # Linux builder ONLY. This job is NOT pure shell: it runs `docker buildx
    # imagetools create` and `python3 -c "import yaml"`. The bare
    # [self-hosted, apexos-builder] label set also matches the ARM64 builder,
    # which is a macOS workstation with no provisioned PyYAML -- so which
    # runner picked the job decided whether the manifest got published.
    runs-on: [self-hosted, apexos-builder, linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout docker-base (provenance only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: read upstream calver
        id: version
        run: |
          v=$(python3 -c "import yaml; print(yaml.safe_load(open('.apexos/provenance.yaml'))['upstream']['ref'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: create ghcr multi-arch manifests
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          publish() { # $1=image $2=tag [$3=floating alias, e.g. latest]
            tags=(-t "$GHCR_NS/$1:$2" -t "$GHCR_NS/$1:$2-$VERSION")
            if [ -n "${3:-}" ]; then tags+=(-t "$GHCR_NS/$1:$3"); fi
            docker buildx imagetools create "${tags[@]}" \
              "$GHCR_NS/$1:$2-$VERSION-amd64" \
              "$GHCR_NS/$1:$2-$VERSION-aarch64"
          }
          # base:latest is a RUNTIME contract (task #36): the Supervisor's
          # apps/build.py falls back to BUILD_FROM=ghcr.io/.../base:latest
          # for local addons whose build.yaml lacks build_from and builds
          # with --pull — ghcr must serve it.
          publish base 3.23 latest
          publish base-python 3.13-alpine3.23
          publish base-python 3.14-alpine3.23
          publish base-debian trixie
          publish base-ubuntu 26.04

      - name: create registry mirror manifests (blocked-on-box tolerated)
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::warning::REGISTRY_PASSWORD not set — skipping registry manifests"
            exit 1
          fi
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          publish() { # $1=image $2=tag
            docker buildx imagetools create \
              -t "$REGISTRY_NS/$1:$2" \
              -t "$REGISTRY_NS/$1:$2-$VERSION" \
              "$REGISTRY_NS/$1:$2-$VERSION-amd64" \
              "$REGISTRY_NS/$1:$2-$VERSION-aarch64"
          }
          publish base 3.23
          publish base-python 3.13-alpine3.23
          publish base-python 3.14-alpine3.23
          publish base-debian trixie
          publish base-ubuntu 26.04

      # Every `docker login` in this job writes its credential into
      # ~/.docker/config.json, and these runners' home directories are SHARED
      # and outlive the job, so nothing removes it. The aarch64 builder was
      # found holding a ghs_ job token from some earlier run this way: while
      # that token is valid it is a live credential on disk for whatever runs
      # next, and afterwards it is a dead entry that docker keeps offering, so
      # a registry failure no longer says which credential was even tried.
      #
      # always() so a failure earlier in the job does not skip the cleanup, and
      # never fail the job on it: `docker logout` already exits 0 for a registry
      # that was never logged into, so a nonzero here would only mask the real
      # result.
      - name: drop the registry credentials from the shared runner home
        if: always()
        run: |
          docker logout ghcr.io || true
          docker logout "$REGISTRY" || true
